
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Web Practical</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #eaf2f8;
            padding: 60px 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            margin: auto;
        }
        button {
            padding: 12px 20px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Cloud Website!</h1>
        <p>This is my Cloud Computing practical.</p>
        <p>Hosted using GitHub Pages.</p>
        <button onclick="showMessage()">Click Me</button>
        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "My web application is working successfully!";
        }
    </script>
</body>
</html>
